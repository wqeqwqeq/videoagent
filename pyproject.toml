[project]
name = "videoagent"
version = "0.1.0"
description = "Generate narrated videos from Tableau dashboards using Azure OpenAI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Microsoft Agent Framework
    "agent-framework>=1.0.0b251120",
    # Tableau Server Client
    "tableauserverclient>=0.31",
    # Azure OpenAI
    "openai>=1.55.0",
    # Configuration
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Azure Blob Storage (optional, for blob storage mode)
    "azure-storage-blob>=12.19.0",
    "azure-identity>=1.15.0",
]

[tool.uv]
prerelease = "allow"
